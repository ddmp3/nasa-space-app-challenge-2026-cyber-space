# Test local complet (API + front) avant un déploiement Azure.
#   docker compose up --build      puis ouvrir http://localhost:8080
# L API interroge les vraies sources (NASA POWER, USGS, GVP) ; pente, rugosité et MODIS viennent de data/candidates-precomputed.json.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3001"
      FRONTEND_URL: http://localhost:8080
    ports:
      - "3001:3001"
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3001
    environment:
      API_ORIGIN: http://localhost:3001
    ports:
      - "8080:80"
    depends_on:
      - api
